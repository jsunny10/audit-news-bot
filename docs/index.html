<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HCS Audit News </title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        /* 상단 배너 영역 */
        .header-banner {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: block;
        }
        .header-banner img {
            width: 100%;
            height: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* 메인 컨테이너 */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            gap: 30px;
        }
        /* 왼쪽 달력 섹션 */
        .sidebar {
            flex: 1;
            min-width: 200px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;
        }
        .sidebar h3 {
            margin-top: 0;
            font-size: 14pt;
            color: #111;
            border-bottom: 2px solid #222;
            padding-bottom: 10px;
        }
        .date-picker {
            width: 100%;
            padding: 10px;
            font-size: 11pt;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        /* 오른쪽 뉴스 콘텐츠 섹션 */
        .content {
            flex: 2.5;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            min-height: 400px;
        }
        .content h2 {
            margin-top: 0;
            font-size: 15pt;
            color: #0f172a;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }
        /* 카테고리 스타일 */
        .category-box {
            margin-bottom: 35px;
        }
        .category-title {
            font-size: 13pt;
            font-weight: bold;
            color: #1e293b;
            background: #f1f5f9;
            padding: 8px 15px;
            border-left: 4px solid #38bdf8;
            margin-bottom: 15px;
        }
        /* 뉴스 항목 스타일 */
        .news-item {
            margin-bottom: 15px;
            padding-left: 5px;
        }
        .news-title {
            font-size: 11pt;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .news-title a {
            color: #1a0dab;
            text-decoration: none;
        }
        .news-title a:hover {
            text-decoration: underline;
        }
        .news-url {
            font-size: 9pt;
            color: #006621;
            word-break: break-all;
        }
        .no-data {
            color: #888;
            text-align: center;
            padding-top: 50px;
            font-size: 11pt;
        }

        /* 20261127 페이지 네이션 버튼 스타일 추가 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            align-items: center;
        }
        .pagination button {
            padding: 6px 14px;
            font-size: 10pt;
            border: 1px solid #cdb5e1;
            border-radius: 4px;
            background: #fff;
            color: #1e293b;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pagination button:hover:not(:disabled) {
            background: #e2e8f0;
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .page-info {
            font-size: 10pt;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- 상단 배너 -->
    <div class="header-banner">
        <img src="image_news.jpeg" alt="Audit News Banner">
    </div>

    <div class="container">
        <!-- 달력 선택기 -->
        <div class="sidebar">
            <h3> 일자선택 </h3>
            <input type="date" id="reportDate" class="date-picker">
        </div>

        <!-- 뉴스 출력 본문 -->
        <div class="content">
            <h2 id="viewDateTitle">날짜를 선택해 주세요</h2>
            <div id="newsContainer">
                <p class="no-data">좌측 달력에서 조회할 일자를 선택하시면 카테고리별 뉴스가 표시됩니다.</p>
            </div>
        </div>
    </div>

    <script>
        const NEWS_PER_page = 10;

        const dateInput = document.getElementById('reportDate');
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        dateInput.addEventListener('change', (e) => {
            fetchNewsData(e.target.value);
        });

        function fetchNewsData(dateStr) {
            const titleZone = document.getElementById('viewDateTitle');
            const container = document.getElementById('newsContainer');
            
            titleZone.innerText = `📅 ${dateStr} News Report`;
            container.innerHTML = '<p class="no-data">데이터를 불러오는 중입니다...</p>';

            fetch(`data/${dateStr}.json`)
                .then(response => {
                    if (!response.ok) throw new Error('해당 날짜에 생성된 리포트가 없습니다.');
                    return response.json();
                })
                .then(data => {
                    currentData = data;
                    currentPages = {};
                    renderAll();
//                    container.innerHTML = ''; 
                })
                .catch(error => {
                    currentData = null;
                    container.innerHTML = `<p class="no-data"> ⚠️ ${error.message}</p>`;
                });
        }

        function renderAll() {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';

            for(const [category, newsList] of Object.entries(currentData)) {
                if (!newsList || newsList.length === 0) continue;
                container.appenChild(renderCategoryBox(category, newsList));
            }
        }

        }
        
        function createPagination(category, page, totalPages) {
            const pag = document.createElement('div');
            pag.classNme = 'pagination';

            const prevBtn = document.createElement('button');
            prevBtn.textContent = '◀ 이전';
            prevBtn.disabled = page <= 1;
            prevBtn.addEventListener('click', () => {
                currentPages[category]--;
                renderAll();
            });

            const info = document.createElement('span');
            info.className = 'page-info';
            info.textcontent = `${page} / ${totalPages} 페이지`;

            const nextBtn = document.createElement('button');
            nextBtn.textContent = '다음 ▶';
            nextBtn.disabled = page >= totalPages;
            nextBtn.addEventListener('click', () => {
                currentPages[category]++;
                renderAll();
            });

            pag.appendChild(prevBtn);
            pag.appendChild(info);
            pag.appendChild(nextBtn);

            return pag;            
        }

        fetchNewsData(today);
    </script>
</body>
</html>
